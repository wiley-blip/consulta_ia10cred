<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload de Contratos - FACTA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 900px;
            width: 100%;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
            cursor: pointer;
        }

        input[type="file"]:focus {
            outline: none;
            border-color: #667eea;
        }

        input[type="file"]::file-selector-button {
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
            font-weight: 600;
        }

        input[type="file"]::file-selector-button:hover {
            background: #764ba2;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-upload {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-upload:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-limpar {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }

        .btn-limpar:hover {
            background: #e0e0e0;
        }

        .btn-historico {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-historico:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .btn-historico:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .resultado {
            margin-top: 30px;
            display: none;
        }

        .resultado.ativo {
            display: block;
        }

        .resultado-header {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .resultado-header h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-sucesso {
            background: #d4edda;
            color: #155724;
        }

        .status-erro {
            background: #f8d7da;
            color: #721c24;
        }

        .resultado-body {
            background: #fafafa;
            padding: 20px;
            border-radius: 5px;
            overflow-x: auto;
        }

        .tabela-pessoas {
            width: 100%;
            border-collapse: collapse;
        }

        .tabela-pessoas thead {
            background: #667eea;
            color: white;
        }

        .tabela-pessoas th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        .tabela-pessoas td {
            padding: 10px 12px;
            border-bottom: 1px solid #ddd;
        }

        .tabela-pessoas tbody tr:hover {
            background: #f0f0f0;
        }

        .tabela-pessoas tbody tr:nth-child(even) {
            background: #fafafa;
        }

        .btn-pesquisar-contratos {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            margin-top: 15px;
        }

        .btn-pesquisar-contratos:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }

        .progresso-consulta {
            background: #e7f3ff;
            border: 1px solid #b3d9ff;
            color: #004085;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
        }

        .progresso-consulta.ativo {
            display: block;
        }

        .progresso-barra {
            background: #ddd;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progresso-preenchimento {
            background: linear-gradient(90deg, #28a745 0%, #20c997 100%);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }

        .resumo-resultados {
            margin-top: 30px;
            display: none;
        }

        .resumo-resultados.ativo {
            display: block;
        }

        .resumo-header {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            border-left: 4px solid #28a745;
        }

        .resumo-header h3 {
            color: #155724;
            margin-bottom: 5px;
        }

        .resumo-stats {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: white;
            padding: 10px 15px;
            border-radius: 5px;
            border-left: 4px solid #28a745;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #155724;
        }

        .tabela-resumo {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .tabela-resumo thead {
            background: #28a745;
            color: white;
        }

        .tabela-resumo th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        .tabela-resumo td {
            padding: 10px 12px;
            border-bottom: 1px solid #ddd;
        }

        .tabela-resumo tbody tr:hover {
            background: #f5f5f5;
        }

        .tabela-resumo tbody tr:nth-child(even) {
            background: #fafafa;
        }

        .status-sucesso-texto {
            color: #28a745;
            font-weight: 600;
        }

        .status-erro-texto {
            color: #dc3545;
            font-weight: 600;
        }

        .erro {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .erro.ativo {
            display: block;
        }

        .info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .info.ativo {
            display: block;
        }

        /* Modal de Histórico */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.ativo {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 30px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .modal-header h2 {
            margin: 0;
            color: #333;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            color: #333;
        }

        .historico-vazio {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .historico-vazio p {
            margin: 0;
            font-size: 16px;
        }

        .historico-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .historico-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border: 1px solid #f0f0f0;
            border-radius: 5px;
            margin-bottom: 10px;
            background: #fafafa;
        }

        .historico-item:hover {
            background: #f5f5f5;
        }

        .historico-info {
            flex: 1;
        }

        .historico-nome {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .historico-meta {
            font-size: 12px;
            color: #999;
        }

        .historico-tamanho {
            margin-right: 20px;
            color: #666;
            font-size: 12px;
        }

        .historico-download {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .historico-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .historico-download:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📤 Upload de Arquivo - FACTA</h1>

        <div class="erro" id="erroArquivo"></div>
        <div class="info" id="infoArquivo"></div>

        <div class="form-group">
            <label for="arquivo">Selecione um arquivo Excel (.xlsx ou .xls)</label>
            <input 
                type="file" 
                id="arquivo" 
                accept=".xlsx,.xls"
            >
            <small style="color: #666; margin-top: 5px; display: block;">Formato esperado: Coluna 1 = Nome, Coluna 2 = CPF</small>
        </div>

        <div class="button-group">
            <button class="btn-upload" id="btnUpload">📤 Enviar Arquivo</button>
            <button class="btn-historico" id="btnHistorico">📋 Histórico</button>
            <button class="btn-limpar" id="btnLimpar">🗑️ Limpar</button>
        </div>

        <div class="loading" id="loadingArquivo">
            <div class="spinner"></div>
            <p>Processando arquivo...</p>
        </div>

        <div class="resultado" id="resultadoArquivo">
            <div class="resultado-header">
                <h3>Pessoas no Arquivo</h3>
                <span class="status-badge" id="statusArquivoBadge"></span>
            </div>
            <div class="resultado-body">
                <table class="tabela-pessoas">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Nome</th>
                            <th>CPF</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaPessoas"></tbody>
                </table>
                <button class="btn-upload btn-pesquisar-contratos" id="btnPesquisarContratos" style="display: none;">🔎 Pesquisar Contratos</button>
            </div>
        </div>

        <div class="progresso-consulta" id="progressoConsulta">
            <div style="margin-bottom: 10px;">
                <strong>Consultando:</strong> <span id="consultandoNome"></span>
            </div>
            <div class="progresso-barra">
                <div class="progresso-preenchimento" id="progressoPreenchimento"></div>
            </div>
            <div style="font-size: 12px; text-align: right; color: #666;">
                <span id="progressoTexto">0 / 0</span>
            </div>
        </div>

        <div class="resumo-resultados" id="resumoResultados">
            <div class="resumo-header">
                <h3>✅ Resumo de Consultas</h3>
                <div class="resumo-stats">
                    <div class="stat-box">
                        <div class="stat-label">Total Consultado</div>
                        <div class="stat-value" id="totalConsultado">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Sucesso</div>
                        <div class="stat-value" id="totalSucesso">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Erro</div>
                        <div class="stat-value" id="totalErro">0</div>
                    </div>
                </div>
            </div>
            <div class="resultado-body">
                <table class="tabela-resumo">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>CPF</th>
                            <th>Status</th>
                            <th>Contratos</th>
                            <th>Mensagem</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaResumo"></tbody>
                </table>
                <button class="btn-upload" id="btnBaixarPlanilha" style="margin-top: 20px; display: none;">📥 Baixar Planilha de Sucessos</button>
            </div>
        </div>
    </div>

    <!-- Modal de Histórico -->
    <div class="modal-overlay" id="modalHistorico">
        <div class="modal">
            <div class="modal-header">
                <h2>📋 Histórico de Downloads</h2>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <ul class="historico-list" id="historicoList"></ul>
        </div>
    </div>

    <script>
        const arquivoInput = document.getElementById('arquivo');
        const btnUpload = document.getElementById('btnUpload');
        const btnLimpar = document.getElementById('btnLimpar');
        const btnPesquisarContratos = document.getElementById('btnPesquisarContratos');
        const btnBaixarPlanilha = document.getElementById('btnBaixarPlanilha');
        const loadingArquivo = document.getElementById('loadingArquivo');
        const resultadoArquivo = document.getElementById('resultadoArquivo');
        const tabelaPessoas = document.getElementById('tabelaPessoas');
        const statusArquivoBadge = document.getElementById('statusArquivoBadge');
        const erroArquivoDiv = document.getElementById('erroArquivo');
        const infoArquivoDiv = document.getElementById('infoArquivo');
        const progressoConsulta = document.getElementById('progressoConsulta');
        const resumoResultados = document.getElementById('resumoResultados');

        // Dados carregados do arquivo
        let pessoasCarregadas = [];
        let dadosSucesso = []; // Armazenar dados completos dos sucessos

        function limparMensagensArquivo() {
            erroArquivoDiv.classList.remove('ativo');
            infoArquivoDiv.classList.remove('ativo');
        }

        function mostrarErroArquivo(mensagem) {
            erroArquivoDiv.textContent = '⚠️ ' + mensagem;
            erroArquivoDiv.classList.add('ativo');
        }

        function mostrarInfoArquivo(mensagem) {
            infoArquivoDiv.textContent = 'ℹ️ ' + mensagem;
            infoArquivoDiv.classList.add('ativo');
        }

        // Gerar planilha Excel com dados de sucesso
        function gerarPlanilhaExcel() {
            if (dadosSucesso.length === 0) {
                mostrarErroArquivo('Nenhum dado com sucesso para exportar');
                return;
            }

            try {
                btnBaixarPlanilha.disabled = true;
                mostrarInfoArquivo('Gerando planilha...');

                console.log('[DEBUG] Enviando dados:', dadosSucesso);

                const payload = JSON.stringify({
                    dados: dadosSucesso
                });
                const tamanhoPayload = new Blob([payload]).size;
                console.log('[DEBUG] Tamanho do payload:', (tamanhoPayload / 1024 / 1024).toFixed(2), 'MB');

                // Enviar dados para o servidor gerar o Excel
                fetch('/api/exportar-excel', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: payload
                })
                .then(response => {
                    console.log('[DEBUG] Response status:', response.status);
                    console.log('[DEBUG] Response headers:', response.headers);

                    if (!response.ok) {
                        return response.json().then(err => {
                            throw new Error(err.mensagem || `HTTP ${response.status}`);
                        }).catch(() => {
                            throw new Error(`HTTP ${response.status}: Erro ao processar resposta`);
                        });
                    }
                    return response.blob();
                })
                .then(blob => {
                    console.log('[DEBUG] Blob recebido, tamanho:', blob.size);

                    // Criar link para download
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    const dataAtual = new Date().toISOString().split('T')[0];
                    a.download = `contratos_${dataAtual}.xlsx`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);

                    mostrarInfoArquivo('Planilha baixada com sucesso!');
                    btnBaixarPlanilha.disabled = false;
                })
                .catch(erro => {
                    console.error('[DEBUG] Erro:', erro);
                    mostrarErroArquivo('Erro ao gerar planilha: ' + erro.message);
                    btnBaixarPlanilha.disabled = false;
                });
            } catch (erro) {
                console.error('[DEBUG] Erro ao preparar:', erro);
                mostrarErroArquivo('Erro ao preparar planilha: ' + erro.message);
                btnBaixarPlanilha.disabled = false;
            }
        }

        // Upload de arquivo
        btnUpload.addEventListener('click', async () => {
            limparMensagensArquivo();

            const arquivo = arquivoInput.files[0];

            if (!arquivo) {
                mostrarErroArquivo('Selecione um arquivo');
                return;
            }

            const extensoesValidas = ['application/vnd.ms-excel', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'];
            if (!extensoesValidas.includes(arquivo.type) && !arquivo.name.endsWith('.xlsx') && !arquivo.name.endsWith('.xls')) {
                mostrarErroArquivo('Selecione um arquivo Excel válido (.xlsx ou .xls)');
                return;
            }

            btnUpload.disabled = true;
            loadingArquivo.style.display = 'block';
            resultadoArquivo.classList.remove('ativo');
            progressoConsulta.classList.remove('ativo');
            resumoResultados.classList.remove('ativo');
            tabelaPessoas.innerHTML = '';
            btnPesquisarContratos.style.display = 'none';
            btnBaixarPlanilha.style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('arquivo', arquivo);

                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.sucesso) {
                    statusArquivoBadge.textContent = '✅ ' + data.mensagem;
                    statusArquivoBadge.className = 'status-badge status-sucesso';
                    mostrarInfoArquivo(`Arquivo processado com sucesso! ${data.nomeArquivo}`);

                    // Guardar dados das pessoas
                    pessoasCarregadas = data.pessoas;
                    dadosSucesso = []; // Resetar dados de sucesso

                    // Preencher tabela
                    data.pessoas.forEach((pessoa, index) => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${index + 1}</td>
                            <td>${pessoa.nome}</td>
                            <td>${pessoa.cpf}</td>
                        `;
                        tabelaPessoas.appendChild(row);
                    });

                    resultadoArquivo.classList.add('ativo');
                    btnPesquisarContratos.style.display = 'block';
                } else {
                    statusArquivoBadge.textContent = '❌ Erro';
                    statusArquivoBadge.className = 'status-badge status-erro';
                    mostrarErroArquivo(data.mensagem);
                }

            } catch (erro) {
                mostrarErroArquivo('Erro ao processar arquivo: ' + erro.message);
                resultadoArquivo.classList.remove('ativo');
            } finally {
                btnUpload.disabled = false;
                loadingArquivo.style.display = 'none';
            }
        });

        // Pesquisar contratos em lote
        btnPesquisarContratos.addEventListener('click', async () => {
            if (pessoasCarregadas.length === 0) {
                mostrarErroArquivo('Nenhuma pessoa carregada');
                return;
            }

            btnPesquisarContratos.disabled = true;
            progressoConsulta.classList.add('ativo');
            resumoResultados.classList.remove('ativo');
            btnBaixarPlanilha.style.display = 'none';
            dadosSucesso = []; // Resetar dados de sucesso

            const resultados = [];
            let sucessos = 0;
            let erros = 0;

            for (let i = 0; i < pessoasCarregadas.length; i++) {
                const pessoa = pessoasCarregadas[i];
                const percentual = Math.round(((i + 1) / pessoasCarregadas.length) * 100);

                // Atualizar progresso
                document.getElementById('consultandoNome').textContent = `${pessoa.nome} (${pessoa.cpf})`;
                document.getElementById('progressoTexto').textContent = `${i + 1} / ${pessoasCarregadas.length}`;
                document.getElementById('progressoPreenchimento').style.width = percentual + '%';
                document.getElementById('progressoPreenchimento').textContent = percentual + '%';

                try {
                    const response = await fetch('/api/consultar', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ cpf: pessoa.cpf })
                    });

                    const data = await response.json();

                    if (data.sucesso) {
                        sucessos++;
                        // Armazenar dados completos de sucesso
                        dadosSucesso.push({
                            nome: pessoa.nome,
                            cpf: pessoa.cpf,
                            status: 'Sucesso',
                            dados: data.dados || {}
                        });

                        // Calcular quantidade de contratos
                        let qtdContratos = 0;
                        if (data.dados && data.dados.lista_contratos_refin && Array.isArray(data.dados.lista_contratos_refin)) {
                            qtdContratos = data.dados.lista_contratos_refin.length;
                        }

                        resultados.push({
                            nome: pessoa.nome,
                            cpf: pessoa.cpf,
                            status: 'Sucesso',
                            statusClass: 'status-sucesso-texto',
                            contratos: qtdContratos > 0 ? qtdContratos : '—',
                            mensagem: data.mensagem || 'Consultado com sucesso'
                        });
                    } else {
                        erros++;
                        resultados.push({
                            nome: pessoa.nome,
                            cpf: pessoa.cpf,
                            status: 'Erro',
                            statusClass: 'status-erro-texto',
                            contratos: '—',
                            mensagem: data.mensagem || 'Erro ao consultar'
                        });
                    }
                } catch (erro) {
                    erros++;
                    resultados.push({
                        nome: pessoa.nome,
                        cpf: pessoa.cpf,
                        status: 'Erro',
                        statusClass: 'status-erro-texto',
                        contratos: '—',
                        mensagem: erro.message
                    });
                }

                // Pequeno delay entre requisições
                await new Promise(resolve => setTimeout(resolve, 500));
            }

            // Ocultar progresso
            progressoConsulta.classList.remove('ativo');

            // Exibir resumo
            document.getElementById('totalConsultado').textContent = pessoasCarregadas.length;
            document.getElementById('totalSucesso').textContent = sucessos;
            document.getElementById('totalErro').textContent = erros;

            // Preencher tabela de resumo
            const tabelaResumo = document.getElementById('tabelaResumo');
            tabelaResumo.innerHTML = '';

            resultados.forEach(resultado => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${resultado.nome}</td>
                    <td>${resultado.cpf}</td>
                    <td><span class="${resultado.statusClass}">${resultado.status}</span></td>
                    <td>${resultado.contratos}</td>
                    <td>${resultado.mensagem}</td>
                `;
                tabelaResumo.appendChild(row);
            });

            resumoResultados.classList.add('ativo');
            
            // Mostrar botão de download apenas se houver sucessos
            if (dadosSucesso.length > 0) {
                btnBaixarPlanilha.style.display = 'block';
            }

            btnPesquisarContratos.disabled = false;
        });

        // Baixar planilha
        btnBaixarPlanilha.addEventListener('click', () => {
            gerarPlanilhaExcel();
        });

        // Limpar
        btnLimpar.addEventListener('click', () => {
            arquivoInput.value = '';
            resultadoArquivo.classList.remove('ativo');
            progressoConsulta.classList.remove('ativo');
            resumoResultados.classList.remove('ativo');
            tabelaPessoas.innerHTML = '';
            pessoasCarregadas = [];
            dadosSucesso = [];
            btnPesquisarContratos.style.display = 'none';
            btnBaixarPlanilha.style.display = 'none';
            limparMensagensArquivo();
            arquivoInput.focus();
        });

        // Foco inicial
        arquivoInput.focus();

        // ========================================
        // HISTÓRICO DE ARQUIVOS
        // ========================================

        const btnHistorico = document.getElementById('btnHistorico');
        const modalOverlay = document.getElementById('modalHistorico');
        const modalClose = document.getElementById('modalClose');
        const historicoList = document.getElementById('historicoList');

        // Abrir modal de histórico
        btnHistorico.addEventListener('click', async () => {
            try {
                btnHistorico.disabled = true;
                historicoList.innerHTML = '<div class="historico-vazio"><p>Carregando...</p></div>';
                modalOverlay.classList.add('ativo');

                const response = await fetch('/api/historico');
                const data = await response.json();

                if (!data.sucesso || !data.arquivos || data.arquivos.length === 0) {
                    historicoList.innerHTML = '<div class="historico-vazio"><p>Nenhum arquivo no histórico</p></div>';
                    btnHistorico.disabled = false;
                    return;
                }

                historicoList.innerHTML = '';
                data.arquivos.forEach(arquivo => {
                    const tamanhoMB = (arquivo.tamanho / 1024 / 1024).toFixed(2);
                    const item = document.createElement('li');
                    item.className = 'historico-item';
                    item.innerHTML = `
                        <div class="historico-info">
                            <div class="historico-nome">${arquivo.nome}</div>
                            <div class="historico-meta">${arquivo.dataFormatada}</div>
                        </div>
                        <div class="historico-tamanho">${tamanhoMB} MB</div>
                        <button class="historico-download" data-arquivo="${arquivo.nome}">📥 Download</button>
                    `;
                    historicoList.appendChild(item);
                });

                // Adicionar listeners aos botões de download
                document.querySelectorAll('.historico-download').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const nomeArquivo = e.target.dataset.arquivo;
                        e.target.disabled = true;
                        e.target.textContent = '⏳ Baixando...';
                        
                        try {
                            const response = await fetch(`/api/historico/download/${encodeURIComponent(nomeArquivo)}`);
                            if (!response.ok) {
                                throw new Error(`HTTP ${response.status}`);
                            }
                            
                            const blob = await response.blob();
                            const url = window.URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = nomeArquivo;
                            document.body.appendChild(a);
                            a.click();
                            window.URL.revokeObjectURL(url);
                            document.body.removeChild(a);
                            
                            e.target.textContent = '📥 Download';
                            e.target.disabled = false;
                        } catch (erro) {
                            console.error('[DEBUG] Erro ao baixar:', erro);
                            alert('Erro ao fazer download: ' + erro.message);
                            e.target.textContent = '📥 Download';
                            e.target.disabled = false;
                        }
                    });
                });

                btnHistorico.disabled = false;
            } catch (erro) {
                console.error('[DEBUG] Erro ao carregar histórico:', erro);
                historicoList.innerHTML = '<div class="historico-vazio"><p>Erro ao carregar histórico</p></div>';
                btnHistorico.disabled = false;
            }
        });

        // Fechar modal
        modalClose.addEventListener('click', () => {
            modalOverlay.classList.remove('ativo');
        });

        // Fechar ao clicar fora da modal
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('ativo');
            }
        });
    </script>
</body>
</html>
